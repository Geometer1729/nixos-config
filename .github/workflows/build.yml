name: "Build NixOS Configuration"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nixos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@b67ad2f0e8376a0bc947db191e4484285b6f5b56
      with:
        extra-conf: |
          experimental-features = nix-command flakes

    - name: Check flake
      run: nix flake check

  cache-and-activate:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, balrog, cache-warmer]
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Wake am
      run: |
        wakeonlan 24:4b:fe:57:0b:55
        for _ in {1..120}; do
          if nc -z -w 1 am 22; then
            exit 0
          fi
          sleep 1
        done
        echo "Timed out waiting for am" >&2
        exit 1

    - name: Check flake
      run: nix flake check

    - name: Warm system closures
      run: |
        nix build --out-link /var/lib/cache-warmer/am \
          .#nixosConfigurations.am.config.system.build.toplevel
        nix build --out-link /var/lib/cache-warmer/torag \
          .#nixosConfigurations.torag.config.system.build.toplevel
        nix build --out-link /var/lib/cache-warmer/balrog \
          .#nixosConfigurations.balrog.config.system.build.toplevel

    - name: Activate balrog and schedule reboot
      run: |
        rm -f /var/lib/cache-warmer/activation-{success,failed}
        touch /var/lib/cache-warmer/activate
        for _ in {1..300}; do
          if [[ -f /var/lib/cache-warmer/activation-success ]]; then
            cat /var/lib/cache-warmer/activation-success
            exit 0
          fi
          if [[ -f /var/lib/cache-warmer/activation-failed ]]; then
            cat /var/lib/cache-warmer/activation-failed >&2
            exit 1
          fi
          sleep 1
        done
        echo "Timed out waiting for balrog activation" >&2
        exit 1
