name: "Build NixOS Configuration"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nixos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@b67ad2f0e8376a0bc947db191e4484285b6f5b56
      with:
        extra-conf: |
          experimental-features = nix-command flakes

    - name: Check flake
      run: nix flake check

    - name: Build configurations
      run: |
        # Build all NixOS configurations
        nix build .#nixosConfigurations.am.config.system.build.toplevel
        nix build .#nixosConfigurations.torag.config.system.build.toplevel
        nix build .#nixosConfigurations.balrog.config.system.build.toplevel

        # Build home-manager configurations
        nix build .#homeConfigurations.bbrian.activationPackage
        nix build .#homeConfigurations.root.activationPackage

  format-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@b67ad2f0e8376a0bc947db191e4484285b6f5b56
      with:
        extra-conf: |
          experimental-features = nix-command flakes

    - name: Check formatting
      run: |
        nix develop --command nixpkgs-fmt --check .

    - name: Check for issues
      run: |
        # Check for dead code if available
        if nix develop --command which deadnix >/dev/null 2>&1; then
          nix develop --command deadnix --fail
        fi

        # Check for antipatterns if available
        if nix develop --command which statix >/dev/null 2>&1; then
          nix develop --command statix check
        fi

  cache-and-activate:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, balrog, cache-warmer]
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Wake am
      run: |
        wakeonlan 24:4b:fe:57:0b:55
        for _ in {1..120}; do
          if nc -z -w 1 am 22; then
            exit 0
          fi
          sleep 1
        done
        echo "Timed out waiting for am" >&2
        exit 1

    - name: Check flake
      run: nix flake check

    - name: Warm system closures
      run: |
        nix build --out-link /var/lib/cache-warmer/am \
          .#nixosConfigurations.am.config.system.build.toplevel
        nix build --out-link /var/lib/cache-warmer/torag \
          .#nixosConfigurations.torag.config.system.build.toplevel
        nix build --out-link /var/lib/cache-warmer/balrog \
          .#nixosConfigurations.balrog.config.system.build.toplevel

    - name: Activate balrog
      run: |
        sudo "$(readlink -f /run/current-system/sw/bin/systemctl)" \
          start cache-warmer-activate.service

    - name: Schedule reboot
      run: sudo "$(readlink -f /run/current-system/sw/bin/schedule-balrog-reboot)"
