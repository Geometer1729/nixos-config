<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="description" content="Quick access to hosted applications.">
    <title>Services</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #0f1115;
        --panel: #161a21;
        --border: #303744;
        --text: #e6e8eb;
        --muted: #a0a8b5;
        --accent: #9ab8f5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        background: var(--background);
        color: var(--text);
        font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        flex: 1;
        width: 100%;
        max-width: 40rem;
        margin: 0 auto;
        padding: clamp(3rem, 10vh, 6rem) 1.5rem 3rem;
      }
      header { margin-bottom: 2.5rem; }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.2;
      }
      p { margin: 0; color: var(--muted); }
      .services {
        display: grid;
        gap: 1rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        padding: 1.5rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--panel);
        color: inherit;
        text-decoration: none;
      }
      .card:hover { border-color: var(--accent); background: #1b2029; }
      .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
      .card h2 { margin: 0 0 0.25rem; font-size: 1.0625rem; font-weight: 600; }
      .card p { font-size: 0.9375rem; }
      .action { color: var(--accent); font-size: 0.9375rem; font-weight: 600; white-space: nowrap; }
      footer { padding: 1.5rem; text-align: center; font-size: 0.8125rem; }
      @media (max-width: 30rem) {
        .card { align-items: flex-start; flex-direction: column; gap: 1rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Services</h1>
        <p>Quick access to hosted applications.</p>
      </header>
      <ul class="services" role="list">
        <li>
          <a class="card" href="/foundry/">
            <div>
              <h2>Foundry Virtual Tabletop</h2>
              <p>Tabletop RPG sessions, maps, and campaign tools.</p>
            </div>
            <span class="action">Open <span aria-hidden="true">&rarr;</span></span>
          </a>
        </li>
      </ul>
    </main>
    <footer><p>Access to some services requires an account.</p></footer>
  </body>
</html>
